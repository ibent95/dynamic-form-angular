<mat-card class="max-w-none m-7 custom-card">
	<mat-card-title>Publication Forms & Versions Configurations</mat-card-title>
	<!--<mat-card-subtitle>Overview information and table of publication forms and versions comfigurations</mat-card-subtitle>-->

	<mat-divider></mat-divider>

	<mat-card-content class="p-0">

		<mat-tab-group animationDuration="1000ms" color="accent" [selectedIndex]="activeTab" (selectedIndexChange)="activeTab = $event">

			<mat-tab label="Publication Form Versions Configurations">
				<app-publication-form-versions-configurations [activeTab]="activeTab"></app-publication-form-versions-configurations>
			</mat-tab>

			<mat-tab label="Publication Forms Configurations">

				<mat-card class="max-w-none m-7">

					<mat-card-title>Publication Forms Configurations</mat-card-title>
					<mat-card-subtitle>Overview information and table of publication forms comfigurations</mat-card-subtitle>

					<mat-divider></mat-divider>

					<mat-card-content>

						<div class="grid grid-cols-2 mb-4">
							<div align="start">
								<ng-container *ngIf="serverResponse">
									<table class="table-auto w-full">
										<tbody>
											<tr>
												<td>Server messages</td>
												<td>:</td>
												<td>"{{ serverResponse.message }}"</td>
											</tr>
											<tr>
												<td>Server date</td>
												<td>:</td>
												<td>{{ serverResponse.date | date: 'fullDate' }}</td>
											</tr>
										</tbody>
									</table>
								</ng-container>
							</div>
							<div align="end">
								<button mat-raised-button class="content-center" color="accent" (click)="onAddDataClick()">
									<mat-icon>add</mat-icon>
									Add
								</button>
							</div>
						</div>

						@if (!showTable) {
							<app-ghost-table [rowCount]="3" [columnCount]="3"></app-ghost-table>
						}

						@if (showTable) {
							<app-table
								[columns]="tableDisplayedColumns"
								[dataSource]="tableDataSource"
								[page]="tableDataPage"
								(dataDetail)="onDetailsDataClick($event)"
								(dataEdit)="onEditDataClick($event)"
								(dataDelete)="onRemoveDataClick($event)"
								(pageChange)="getTableData($event)"
								></app-table>
						}

					</mat-card-content>

				</mat-card>

			</mat-tab>

		</mat-tab-group>

	</mat-card-content>

</mat-card>
