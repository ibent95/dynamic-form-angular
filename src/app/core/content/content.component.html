<ng-container>

	<!-- 404 content if route not exist -->
	@if (!isRouteExists) {
		<app-page-not-found></app-page-not-found>
	}

	@if (isRouteExists) {
		<!-- Default content (home) -->
		@if (isRootRoute) {
			<app-overview></app-overview>
		}

		<!-- Other content if route is exist -->
		<ng-container #dynamicRef></ng-container>
	}

</ng-container>
